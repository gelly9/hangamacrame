name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Pages must already be enabled with build_type=workflow. GITHUB_TOKEN
      # cannot create the Pages site itself ("Resource not accessible by
      # integration"), so `enablement: true` does not help here.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Push the new URLs to Bing rather than waiting to be crawled. Bing backs
  # ChatGPT's web search, so faster Bing indexing feeds AI visibility too.
  #
  # continue-on-error on purpose: this is a notification, not part of shipping
  # the site. A hiccup at Bing must never turn a green deploy red.
  notify-indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Ping IndexNow
        run: |
          code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' \
            -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json' \
            -d '{
              "host": "hangamacrame.com",
              "key": "06d92489a1410183d9b831cf2e40a477",
              "keyLocation": "https://hangamacrame.com/06d92489a1410183d9b831cf2e40a477.txt",
              "urlList": [
                "https://hangamacrame.com/en/",
                "https://hangamacrame.com/ro/",
                "https://hangamacrame.com/hu/"
              ]
            }')
          echo "IndexNow responded $code"
          cat /tmp/out.txt || true
          # 200 accepted, 202 accepted-pending-key-validation. Anything else is
          # informational only — see continue-on-error above.
